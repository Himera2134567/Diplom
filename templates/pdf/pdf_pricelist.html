<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Прайс-лист ({{ category }})</title>
  <style>
    body { font-family: DejaVu Sans, sans-serif; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ccc; padding: 5px; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Прайс-лист: категория {{ category }}</h1>
  <p>Сформировано: {{ current_date|date:"d.m.Y H:i" }}</p>
  <hr>
  <table>
    <thead>
      <tr>
        <th>Наименование</th>
        <th>Цена</th>
      </tr>
    </thead>
    <tbody>
      {% for product in products %}
        <tr>
          <td>{{ product.name }}</td>
          <td>{{ product.price }} руб.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
