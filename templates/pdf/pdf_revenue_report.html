<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчёт о выручке</title>
  <style>
    body { font-family: DejaVu Sans, sans-serif; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ccc; padding: 5px; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Отчёт о выручке</h1>
  <p>Период: с {{ start_date }} по {{ end_date }}</p>
  <p>Сформировано: {{ current_date|date:"d.m.Y H:i" }}</p>
  <hr>
  <table>
    <thead>
      <tr>
        <th>Месяц</th>
        <th>Сумма</th>
      </tr>
    </thead>
    <tbody>
      {% for row in monthly_data %}
        <tr>
          <td>{{ row.month|date:"Y-m" }}</td>
          <td>{{ row.total_sum|default_if_none:"0" }} руб.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  <h3>Итого: {{ overall_sum|default_if_none:"0" }} руб.</h3>
</body>
</html>
