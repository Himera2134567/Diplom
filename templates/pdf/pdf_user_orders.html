<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выписка по заказам пользователя</title>
  <style>
    body { font-family: DejaVu Sans, sans-serif; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ccc; padding: 5px; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Выписка по заказам</h1>
  <p>Пользователь: <strong>{{ user.username }}</strong></p>
  <p>Дата формирования: {{ current_date|date:"d.m.Y H:i" }}</p>
  <hr>
  <table>
    <thead>
      <tr>
        <th>Номер заказа</th>
        <th>Дата</th>
        <th>Сумма</th>
      </tr>
    </thead>
    <tbody>
      {% for order in orders %}
        <tr>
          <td>{{ order.id }}</td>
          <td>{{ order.created_at|date:"d.m.Y H:i" }}</td>
          <td>{{ order.total_price }} руб.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  <h3>Итого: {{ total_sum }} руб.</h3>
</body>
</html>
