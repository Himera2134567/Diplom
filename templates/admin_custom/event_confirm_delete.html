<!-- admin_custom/event_confirm_delete.html -->
{% extends 'main/base.html' %}
{% block title %}Удаление мероприятия{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Удалить "{{ event.name }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'custom_admin_event_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
