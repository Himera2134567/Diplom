<!-- main/templates/admin_custom/user_confirm_delete.html -->

{% extends 'main/base.html' %}
{% load static %}

{% block title %}Удалить пользователя{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Удалить пользователя: {{ user_obj.username }}</h2>
    <p>Вы уверены, что хотите удалить этого пользователя?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'custom_admin_user_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
