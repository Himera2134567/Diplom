{% extends "base.html" %}
{% block title %}Добавить комментарий{% endblock %}
{% block content %}
<div class="container mt-5">
  <h2>Добавить комментарий к сообщению</h2>
  <div class="card mb-3">
    <div class="card-body">
      <h5>{{ parent.user.username }} 
        <small class="text-muted">{{ parent.created_at|date:"d M Y H:i" }}</small>
      </h5>
      <p>{{ parent.content }}</p>
    </div>
  </div>
  <form method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Добавить комментарий</button>
    <a href="{% url 'chat_page' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
