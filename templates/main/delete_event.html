<!-- main/templates/main/delete_event.html -->
{% extends 'main/base.html' %}
{% block title %}Удалить мероприятие{% endblock %}
{% block content %}
<div class="container">
    <h2>Удалить мероприятие "{{ event.name }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'event_detail' event.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
